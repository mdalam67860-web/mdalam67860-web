name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: mdalam67860-web
          outputs: |
            output/snake.svg
            output/snake-dark.svg?palette=github-dark
            output/snake-light.svg?palette=github-light
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_DIR: output
